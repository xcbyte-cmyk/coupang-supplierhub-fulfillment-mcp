<!doctype html>
<html lang="ko">
  <head>

    <title>Supplier Hub Fulfillment · 순차형 UI 시안</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f8;
        --panel: #ffffff;
        --line: #dde1e6;
        --line-strong: #c8ced6;
        --text: #23272d;
        --muted: #68727d;
        --muted-2: #8b949e;
        --blue: #1677d2;
        --blue-soft: #eef6fd;
        --green: #2f7d5c;
        --green-soft: #edf7f1;
        --amber: #a66518;
        --amber-soft: #fff8ea;
        --red: #c84242;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        color: var(--text);
        font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
      }
      button, input, select { font: inherit; }
      button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
        outline: 2px solid #75afe5;
        outline-offset: 2px;
      }
      .shell { width: min(1380px, calc(100% - 32px)); margin: 0 auto; padding: 22px 0 44px; }
      .topbar, .workspace, .recovery { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; }
      .topbar { padding: 20px 22px; }
      .eyebrow { color: var(--blue); font-size: 12px; font-weight: 800; }
      h1, h2, h3, p { margin: 0; }
      h1 { margin-top: 6px; font-size: clamp(22px, 3vw, 30px); letter-spacing: -.025em; }
      .top-grid { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
      .run-meta { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
      .pill { padding: 6px 9px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); font-size: 12px; background: #fafbfc; }
      .pill.live { border-color: #b9ddca; color: #256b4d; background: #eef8f2; }
      .progress { margin-top: 18px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
      .progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: #e8ebef; }
      .progress-value { width: 87.5%; height: 100%; background: var(--blue); }
      .progress-copy { color: var(--muted); font-size: 12px; white-space: nowrap; }
      .workspace { margin-top: 14px; display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 670px; overflow: hidden; }
      .rail { border-right: 1px solid var(--line); background: #fafbfc; padding: 16px 12px 22px; overflow: auto; }
      .phase + .phase { margin-top: 18px; }
      .phase-title { padding: 0 9px 7px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .04em; }
      .step {
        width: 100%; min-height: 52px; margin: 3px 0; padding: 8px 9px; border: 1px solid transparent;
        border-radius: 4px; background: transparent; color: var(--text); cursor: pointer; text-align: left;
        display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 9px; align-items: center;
      }
      .step:hover { background: #ffffff; border-color: var(--line); }
      .step.active { background: var(--blue-soft); border-color: #9ac5ea; }
      .step-number {
        width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line-strong);
        border-radius: 50%; background: #fff; color: var(--muted); font-size: 11px; font-weight: 800;
      }
      .step.done .step-number { border-color: #9cc9b0; background: var(--green-soft); color: var(--green); }
      .step.active .step-number { border-color: var(--blue); background: var(--blue); color: #fff; }
      .step-name { font-size: 13px; font-weight: 730; line-height: 1.3; }
      .step-summary { margin-top: 3px; color: var(--muted-2); font-size: 10px; line-height: 1.3; }
      .state { color: var(--muted-2); font-size: 10px; }
      .step.done .state { color: var(--green); }
      .step.active .state { color: var(--blue); font-weight: 800; }
      .stage-panel { padding: 28px clamp(20px, 4vw, 44px) 32px; }
      .stage-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
      .stage-kicker { color: var(--blue); font-size: 12px; font-weight: 800; }
      .stage-title { margin-top: 6px; font-size: clamp(22px, 3vw, 29px); }
      .stage-description { margin-top: 9px; max-width: 720px; color: var(--muted); line-height: 1.6; }
      .agent { padding: 6px 9px; border: 1px solid #b8cfe4; border-radius: 3px; background: #f4f8fc; color: #2d628f; font-size: 11px; white-space: nowrap; }
      .notice { margin-top: 22px; padding: 13px 14px; border: 1px solid #d9b77c; border-radius: 4px; background: var(--amber-soft); color: #815217; font-size: 13px; line-height: 1.5; }
      .content-grid { margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .block { padding: 16px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
      .block.full { grid-column: 1 / -1; }
      .block-title { color: var(--muted); font-size: 11px; font-weight: 800; }
      .block-value { margin-top: 7px; font-size: 16px; font-weight: 760; line-height: 1.4; }
      .block-help { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .field-grid { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
      input, select { min-height: 42px; width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 4px; background: #fff; color: var(--text); }
      .rows { margin-top: 10px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
      .row { min-height: 45px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
      .row + .row { border-top: 1px solid var(--line); }
      .row strong { font-size: 13px; }
      .row span { color: var(--muted); font-size: 12px; }
      .number-value { color: var(--text) !important; font: 700 14px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .actions { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
      .actions button { min-height: 42px; padding: 0 16px; border: 1px solid #1268ba; border-radius: 3px; background: var(--blue); color: #fff; font-size: 12px; font-weight: 750; cursor: pointer; }
      .actions .secondary { border-color: var(--line-strong); background: #fff; color: #44515e; }
      .actions .danger { border-color: #c95c5c; background: #fff; color: var(--red); }
      .action-note { width: 100%; color: var(--muted); font-size: 11px; line-height: 1.5; }
      .recovery { margin-top: 14px; padding: 14px 18px; color: var(--muted); font-size: 12px; }
      .recovery summary { cursor: pointer; color: #34495e; font-weight: 760; }
      .recovery-grid { margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .prototype-note { margin-top: 9px; color: var(--muted-2); font-size: 11px; }
      @media (max-width: 900px) {
        .workspace { grid-template-columns: 1fr; }
        .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 310px; }
        .top-grid { grid-template-columns: 1fr; }
        .run-meta { justify-content: flex-start; }
      }
      @media (max-width: 600px) {
        .shell { width: calc(100% - 20px); padding-top: 10px; }
        .content-grid, .field-grid, .recovery-grid { grid-template-columns: 1fr; }
        .block.full { grid-column: auto; }
        .stage-panel { padding: 22px 16px 26px; }
        .stage-head { display: grid; }
        .actions button { width: 100%; }
      }
    </style>
  </head>

    <script>
      const phases = [
        { name: "A · 발주 조회", range: [1, 4] },

        { name: "D · 쉽먼트", range: [15, 16] }
      ];

      const stages = [
        { n: 1, name: "Supplier Hub 접속", summary: "로그인·Private Label 이동", agent: "Supplier Hub Agent", description: "Supplier Hub 로그인 상태를 확인하고 Private Label 발주 화면까지 이동합니다.", notice: "로그인이 필요하면 같은 화면에서 로그인 완료 후 다시 확인합니다.", fields: [["연결 대상", "Private Label 발주"], ["상태", "연결 준비"]], secondary: "연결 상태 확인", primary: "Supplier Hub 열기" },
        { n: 2, name: "발주 목록 조회", summary: "조회 기준과 날짜", agent: "Supplier Hub Agent", description: "이 단계에서만 조회 기준과 날짜를 선택합니다.", notice: "기본 조회 기준은 입고예정일입니다.", form: "dates", secondary: "오늘로 설정", primary: "발주 목록 조회" },
        { n: 3, name: "발주 상태 분류", summary: "확정 필요·처리 제외", agent: "Fulfillment Coordinator", description: "조회 결과를 확정 필요, 확정 완료, 미처리 재발견, 처리 제외로 분류합니다.", notice: "Supplier Hub 상태는 변경하지 않습니다.", fields: [["조회 발주", "17건"], ["처리 가능", "1건"]], secondary: "분류 기준 보기", primary: "발주 분류" },
        { n: 4, name: "처리 발주 선택", summary: "Run 생성", agent: "Fulfillment Coordinator", description: "이번 실행에 포함할 발주를 선택하고 Run을 생성합니다.", notice: "선택한 발주만 이후 단계에 전달됩니다.", rows: [["137209097", "동탄1 · 100개"]], secondary: "선택 해제", primary: "선택 발주로 Run 생성" },
        { n: 5, name: "확정 양식 다운로드", summary: "발주확정 원본", agent: "Supplier Hub Agent", description: "거래처확인요청 발주의 발주서 업로드 양식을 내려받습니다.", notice: "이미 발주확정 상태면 이 단계는 자동으로 건너뜁니다.", fields: [["대상 발주", "137209097"], ["파일", "PO_FOR_CONFIRM.xlsx"]], secondary: "대상 확인", primary: "양식 다운로드" },
        { n: 6, name: "확정수량 작성", summary: "발주수량 그대로", agent: "Fulfillment Coordinator", description: "발주수량과 동일한 값으로 확정수량을 작성합니다.", notice: "이 단계에서는 Supplier Hub에 업로드하지 않습니다.", fields: [["발주수량", "100"], ["확정수량", "100"]], secondary: "파일 위치 열기", primary: "확정 파일 준비" },
        { n: 7, name: "업로드·발주확정", summary: "외부 상태 변경", agent: "Supplier Hub Agent", description: "준비된 파일을 Supplier Hub에 업로드해 발주를 확정합니다.", notice: "실제 외부 상태가 변경되는 단계입니다. 업로드 결과가 불명확하면 자동 재시도하지 않습니다.", fields: [["대상", "발주 1건"], ["파일", "발주서_확정_run.xlsx"]], secondary: "업로드 내용 확인", primary: "실제 발주확정 업로드" },
        { n: 8, name: "발주서 다운로드", summary: "인쇄용 발주서", agent: "Supplier Hub Agent", description: "확정된 발주의 인쇄용 발주서를 다운로드합니다.", notice: "다운로드 경로를 결과에 표시합니다.", fields: [["발주번호", "137209097"], ["파일", "발주서_137209097.xlsx"]], secondary: "저장 위치 열기", primary: "발주서 다운로드" },
        { n: 9, name: "발주서 인쇄", summary: "SINDOH N600", agent: "Fulfillment Coordinator", description: "발주서를 지정된 SINDOH 프린터로 제출합니다.", notice: "물리 인쇄 단계입니다. 결과가 불명확하면 자동 재인쇄하지 않습니다.", fields: [["프린터", "SINDOH N600 Series PCL-8"], ["문서", "발주서 1개"]], secondary: "프린터 확인", primary: "실제 발주서 인쇄" },
        { n: 10, name: "인쇄 결과 기록", summary: "후속 처리 전환", agent: "Fulfillment Coordinator", description: "인쇄 제출 결과를 기록하고 로젠 처리 대상으로 전환합니다.", notice: "인쇄물을 검수하는 단계가 아니라 제출 결과를 저장하는 단계입니다.", fields: [["제출 결과", "완료"], ["제출 시각", "2026-07-31 16:26"]], secondary: "인쇄 기록 보기", primary: "결과 기록" },
        { n: 11, name: "로젠 로그인", summary: "연동방법 선택", agent: "Logen Agent", description: "이 단계에서 로젠 연동방법을 선택하고 로그인 상태를 준비합니다.", notice: "웹사이트 MCP와 공식 API 중 하나를 Run에 고정합니다.", form: "logen", secondary: "연동 상태 확인", primary: "로젠 로그인" },
        { n: 12, name: "주문등록 화면 이동", summary: "예약관리 단건", agent: "Logen Agent", description: "예약관리의 주문등록/출력(단건) 화면으로 이동합니다.", notice: "이 단계에서는 주문정보를 입력하거나 저장하지 않습니다.", fields: [["메뉴", "예약관리"], ["화면", "주문등록/출력(단건)"]], secondary: "현재 화면 확인", primary: "주문등록 화면 열기" },
        { n: 13, name: "주문정보 입력·저장", summary: "입수수량·센터·운임", agent: "Logen Agent", description: "입수수량 출처와 저장된 센터 정보를 사용해 로젠 주문정보를 입력하고 저장합니다.", notice: "입수수량 출처는 이 단계에서만 선택합니다. 센터 주소는 저장값 우선, 없으면 발주서를 사용합니다.", form: "master", secondary: "입력값 미리보기", primary: "신규 입력·저장(F5)" },
        { n: 14, name: "로젠 송장 출력", summary: "OLIVE·번호 확정", agent: "Logen Agent", description: "OLIVE 프린터로 송장을 출력하고 Supplier Hub에 사용할 번호를 카톤별로 확정합니다.", notice: "원송장번호와 운송장번호가 모두 있으면 사용자가 직접 선택합니다.", rows: [["카톤 1", "448-8651-1014"], ["카톤 2", "448-8651-1025"]], secondary: "송장번호 확인", primary: "실제 송장 출력" },
        { n: 15, name: "쉽먼트 일괄등록", summary: "준비 테스트·실제 등록", agent: "Supplier Hub Agent", description: "송장입력 XLSX를 준비하고 Supplier Hub 일괄등록 결과를 쉽먼트 번호와 연결합니다.", notice: "먼저 준비 테스트로 파일 첨부와 요약까지만 확인합니다. 실제 등록은 별도 버튼으로 실행합니다.", rows: [["카톤 1 송장", "448-8651-1014"], ["카톤 2 송장", "448-8651-1025"]], secondary: "준비 테스트", primary: "실제 쉽먼트 등록" },
        { n: 16, name: "쉽먼트 문서 출력", summary: "라벨·내역서", agent: "Supplier Hub Agent", description: "등록된 쉽먼트의 라벨과 내역서를 받아 SINDOH로 인쇄합니다.", notice: "15단계 완료와 shipmentId 연결을 확인한 뒤 실행합니다.", fields: [["출력 문서", "쉽먼트 라벨 · 내역서"], ["프린터", "SINDOH N600 Series PCL-8"]], secondary: "출력 대상 확인", primary: "실제 문서 인쇄" }

      const rail = document.querySelector("#rail");
      const stageKicker = document.querySelector("#stageKicker");
      const stageTitle = document.querySelector("#stageTitle");
      const stageDescription = document.querySelector("#stageDescription");
      const stageAgent = document.querySelector("#stageAgent");
      const stageNotice = document.querySelector("#stageNotice");
      const stageContent = document.querySelector("#stageContent");
      const primaryAction = document.querySelector("#primaryAction");
      const secondaryAction = document.querySelector("#secondaryAction");
      const actionNote = document.querySelector("#actionNote");
      let activeStage = 15;

      function renderRail() {
        rail.replaceChildren();
        for (const phase of phases) {
          const group = document.createElement("section");
          group.className = "phase";
          const heading = document.createElement("h3");
          heading.className = "phase-title";
          heading.textContent = phase.name;
          group.append(heading);
          for (const stage of stages.filter(item => item.n >= phase.range[0] && item.n <= phase.range[1])) {
            const button = document.createElement("button");
            const done = stage.n < activeStage;
            button.type = "button";
            button.className = `step${done ? " done" : ""}${stage.n === activeStage ? " active" : ""}`;
            button.innerHTML = `<span class="step-number">${String(stage.n).padStart(2, "0")}</span><span><span class="step-name">${stage.name}</span><span class="step-summary">${stage.summary}</span></span><span class="state">${done ? "완료" : stage.n === activeStage ? "현재" : "대기"}</span>`;
            button.addEventListener("click", () => { activeStage = stage.n; renderRail(); renderStage(stage); });
            group.append(button);
          }
          rail.append(group);
        }
      }

      function block(label, value, help = "") {
        return `<section class="block"><div class="block-title">${label}</div><div class="block-value">${value}</div>${help ? `<p class="block-help">${help}</p>` : ""}</section>`;
      }

      function renderStage(stage) {
        stageKicker.textContent = `${String(stage.n).padStart(2, "0")}단계 · ${stage.n < 11 ? "SUPPLIER HUB" : stage.n < 15 ? "LOGEN" : "SHIPMENT"}`;
        stageTitle.textContent = stage.name;
        stageDescription.textContent = stage.description;
        stageAgent.textContent = stage.agent;
        stageNotice.textContent = stage.notice;
        stageContent.replaceChildren();

        if (stage.form === "dates") {
          stageContent.innerHTML = `<section class="block full"><div class="block-title">조회 조건</div><div class="field-grid"><label>조회 기준<select><option>입고예정일</option><option>발주일</option></select></label><label>시작일<input type="date" value="2026-07-20" /></label><label>종료일<input type="date" value="2026-07-20" /></label></div></section>`;
        } else if (stage.form === "logen") {
          stageContent.innerHTML = `<section class="block full"><div class="block-title">로젠 연결</div><div class="field-grid"><label>연동방법<select><option>웹사이트 MCP</option><option>공식 API</option></select></label><label>현재 상태<input value="로그인 필요" readonly /></label></div></section>`;
        } else if (stage.form === "master") {
          stageContent.innerHTML = `<section class="block full"><div class="block-title">주문등록 입력값</div><div class="field-grid"><label>입수수량 출처<select><option>자동 · 저장값 우선</option><option>저장된 상품정보만</option><option>발주서 값 사용·저장</option></select></label><label>입수수량<input value="50" /></label><label>수하인명<input value="동탄1" /></label><label>박스당 운임<input value="4,000원" /></label></div></section>${block("계산 결과", "총 100개 · 2박스 · 총운임 8,000원", "센터 주소는 저장된 동탄1 정보를 사용합니다.")}`;
        } else if (stage.rows) {
          const rows = stage.rows.map(item => `<div class="row"><strong>${item[0]}</strong><span class="number-value">${item[1]}</span></div>`).join("");
          stageContent.innerHTML = `<section class="block full"><div class="block-title">처리 대상</div><div class="rows">${rows}</div></section>`;
        } else {
          stageContent.innerHTML = (stage.fields || []).map(item => block(item[0], item[1])).join("");
        }

        secondaryAction.textContent = stage.secondary;
        primaryAction.textContent = stage.primary;
        actionNote.textContent = stage.n === 15
          ? "준비 테스트는 외부 등록 없이 업로드 직전에서 멈춥니다."
          : stage.n === 16
            ? "실제 인쇄 버튼은 출력 대상과 프린터를 확인한 뒤 사용합니다."
            : "이 시안의 버튼은 동작 구조 확인용이며 실제 MCP를 호출하지 않습니다.";
      }

      primaryAction.addEventListener("click", () => { actionNote.textContent = "UI 시안에서는 실제 MCP 실행을 차단했습니다."; });
      secondaryAction.addEventListener("click", () => { actionNote.textContent = "보조 동작의 위치와 명칭을 확인하는 UI 시안입니다."; });
      renderRail();
      renderStage(stages.find(stage => stage.n === activeStage));
    </script>
  </body>
</html>
